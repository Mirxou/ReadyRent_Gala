version: '3.8'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=file:/app/data/custom.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      - CHARGILY_API_KEY=${CHARGILY_API_KEY}
      - CHARGILY_MODE=${CHARGILY_MODE:-test}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://standard.rent}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://standard.rent}
      - NODE_ENV=production
    volumes:
      - ./db:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # P2 fix: resource limits to prevent OOM affecting the host
    mem_limit: 1g
    cpus: '1.5'
    depends_on:
      - notifications

  notifications:
    build: ./mini-services/notifications-service
    # P2 fix: bind to 127.0.0.1 only — WS should be reachable via Caddy, not directly
    ports:
      - '127.0.0.1:3004:3004'
    # P0-3 fix: was missing environment block entirely → NEXTAUTH_SECRET='' and DB_PATH
    # pointing to a non-existent path → every WS connection was rejected
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      - DB_PATH=/app/data/custom.db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://standard.rent}
      - NODE_ENV=production
    volumes:
      - ./db:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3004/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: '0.5'
